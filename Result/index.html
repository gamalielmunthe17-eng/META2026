<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Practice META 2026 - Live Results</title>

  <style>

    /* ========================================
       RESET
    ======================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      min-height: 100vh;

      padding: 20px;

      color: #fff;

      text-align: center;

      overflow-x: hidden;

      background: #eeeeee;

      position: relative;
    }


    /* ========================================
       BACKGROUND

       Dibuat layer terpisah supaya tidak
       stretch di iPhone / mobile Safari
    ======================================== */

    body::before {
      content: "";

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      background:
        url("assets/images/IMG_2811.PNG")
        no-repeat
        center top;

      background-size: cover;

      z-index: -1;

      pointer-events: none;
    }


    /* ========================================
       CONTAINER
    ======================================== */

    .container {
      max-width: 900px;

      margin: 350px auto 0;

      border-radius: 14px;

      overflow: hidden;

      background: rgba(245, 245, 245, 0.96);

      border: 1px solid rgba(0, 0, 0, 0.12);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.25);

      position: relative;
    }


    /* ========================================
       HEADER
    ======================================== */

    .header {
      background: #171717;

      text-align: center;

      padding: 16px 15px 14px;

      border-left: 7px solid #d71920;
    }

    .header h1 {
      margin: 0 0 5px 0;

      color: #ffffff;

      font-size: 2rem;

      font-weight: 900;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .header p {
      margin: 0;

      color: #cfcfcf;

      font-size: 0.78rem;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    /* ========================================
       SEARCH
    ======================================== */

    .list-tools {
      display: flex;

      align-items: end;

      justify-content: space-between;

      gap: 14px;

      padding: 14px 18px;

      background: #ffffff;

      color: #181818;

      border-bottom: 1px solid #dddddd;
    }

    .search-control {
      display: grid;

      flex: 1 1 280px;

      gap: 6px;

      text-align: left;

      color: #666666;

      font-size: 0.7rem;

      font-weight: 800;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .search-control input {
      width: 100%;

      min-height: 40px;

      padding: 8px 11px;

      border: 1px solid #bdbdbd;

      border-radius: 5px;

      background: #ffffff;

      color: #181818;

      font: inherit;

      font-size: 0.9rem;

      letter-spacing: 0;

      text-transform: none;
    }

    .search-control input:focus-visible,
    .pagination button:focus-visible {
      outline: 2px solid #d71920;

      outline-offset: 2px;
    }


    /* ========================================
       PAGINATION
    ======================================== */

    .pagination {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      padding: 12px 16px;

      background: #ffffff;

      color: #555555;

      font-size: 0.8rem;

      font-weight: 700;
    }

    .pagination button {
      min-height: 36px;

      padding: 7px 12px;

      border: 1px solid #bdbdbd;

      border-radius: 5px;

      background: #ffffff;

      color: #181818;

      font: inherit;

      cursor: pointer;
    }

    .pagination button:hover:not(:disabled) {
      border-color: #d71920;

      color: #d71920;
    }

    .pagination button:disabled {
      color: #999999;

      cursor: default;
    }


    /* ========================================
       LEADERBOARD
    ======================================== */

    .leaderboard {
      width: 100%;

      overflow-x: auto;

      -webkit-overflow-scrolling: touch;
    }


    /* ========================================
       DESKTOP GRID

       DRIVER | CAR | HOT LAP
    ======================================== */

    .leaderboard-header,
    .driver-row {
      display: grid;

      grid-template-columns:
        0.35fr
        1.5fr
        1.3fr
        1fr;

      gap: 12px;

      align-items: center;

      padding: 18px 24px;
    }


    /* ========================================
       TABLE HEADER
    ======================================== */

    .leaderboard-header {
      background: #d71920;

      color: #ffffff;

      font-size: 0.78rem;

      font-weight: 800;

      letter-spacing: 1px;

      text-transform: uppercase;

      padding-top: 15px;

      padding-bottom: 15px;

      border-bottom: 3px solid #ffd426;
    }


    /* ========================================
       DRIVER ROW
    ======================================== */

    .driver-row {
      background: rgba(255, 255, 255, 0.96);

      color: #181818;

      border-bottom: 1px solid #dddddd;

      transition:
        background 0.2s ease;
    }

    .driver-row:nth-child(even) {
      background: #eeeeee;
    }

    .driver-row:hover {
      background: #e5e5e5;
    }


    .position {
      color: #d71920;

      font-size: 0.9rem;

      font-weight: 900;

      text-align: center;
    }


    /* ========================================
       DRIVER
    ======================================== */

    .driver-name {
      color: #181818;

      font-size: 1rem;

      font-weight: 900;

      text-transform: uppercase;

      text-align: left;
    }


    /* ========================================
       CAR
    ======================================== */

    .car {
      color: #555555;

      font-size: 0.9rem;

      font-weight: 700;

      text-align: center;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* ========================================
       HOT LAP
    ======================================== */

    .hot-lap {
      color: #d71920;

      font-family: "Courier New", monospace;

      font-size: 1.05rem;

      font-weight: 900;

      text-align: center;

      padding: 8px 4px;

      white-space: nowrap;
    }


    /* ========================================
       LOADING / ERROR
    ======================================== */

    .loading,
    .error {
      background: rgba(255, 255, 255, 0.96);

      color: #555555;

      text-align: center;

      padding: 38px 20px;

      font-size: 1.05rem;

      font-weight: 700;
    }

    .error {
      color: #d71920;
    }


    /* ========================================
       META STRIPE
    ======================================== */

    .container::after {
      content: "";

      display: block;

      height: 9px;

      background:
        linear-gradient(
          to bottom,

          #171717 0%,
          #171717 33%,

          #d71920 33%,
          #d71920 66%,

          #ffd426 66%,
          #ffd426 100%
        );
    }


    /* ========================================
       TABLET
    ======================================== */

    @media (min-width: 769px) and (max-width: 1024px) {

      .container {
        width: 88%;

        max-width: 820px;

        margin: 220px auto 0;
      }

      .leaderboard-header,
      .driver-row {
        grid-template-columns:
          0.35fr
          1.4fr
          1.2fr
          0.9fr;

        gap: 8px;

        padding: 15px 16px;
      }

      .driver-name {
        font-size: 0.9rem;
      }

      .car {
        font-size: 0.82rem;
      }

      .hot-lap {
        font-size: 0.95rem;
      }

    }


    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 768px) {

      body {
        padding:
          20px
          0
          40px;
      }


      /*
        Background tetap mengikuti viewport,
        BUKAN panjang seluruh leaderboard.
      */

      body::before {
        width: 100vw;

        height: 100vh;
        height: 100dvh;

        background-position: center top;

        background-size: cover;
      }


      .container {
        width: 82%;

        max-width: 580px;

        margin: 120px auto 0;

        border-radius: 14px;
      }


      /* HEADER */

      .header {
        padding: 18px 8px;
      }

      .header h1 {
        font-size: 1.25rem;

        letter-spacing: 0;

        white-space: nowrap;
      }

      .header p {
        font-size: 0.62rem;

        letter-spacing: 1px;

        white-space: nowrap;
      }


      /* SEARCH */

      .list-tools {
        padding: 12px 14px;
      }


      /* HIDE DESKTOP HEADER */

      .leaderboard-header {
        display: none;
      }

      .leaderboard {
        overflow: hidden;
      }


      /* ========================================
         DRIVER CARD
      ======================================== */

      .driver-row {
        display: grid;

        grid-template-columns: 34px 1fr;

        gap: 9px;

        width: 100%;

        min-width: 0;

        padding:
          14px
          14px
          16px;

        text-align: left;
      }


      .position {
        grid-row: 1 / span 3;

        padding-top: 2px;

        text-align: left;
      }


      .driver-name,
      .car,
      .hot-lap {
        grid-column: 2;
      }


      /* DRIVER */

      .driver-name {
        font-size: 0.9rem;

        text-align: left;
      }

      .driver-name::before {
        content: "DRIVER";

        display: block;

        margin-bottom: 3px;

        color: #777777;

        font-size: 0.62rem;

        font-weight: 700;

        letter-spacing: 1px;
      }


      /* CAR */

      .car {
        width: 100%;

        padding: 9px 10px;

        background: #e5e5e5;

        color: #333333;

        border-radius: 6px;

        text-align: left;

        font-size: 0.82rem;
      }

      .car::before {
        content: "CAR";

        display: block;

        margin-bottom: 3px;

        color: #777777;

        font-size: 0.6rem;

        font-weight: 700;

        letter-spacing: 1px;
      }


      /* HOT LAP */

      .hot-lap {
        width: 100%;

        padding:
          13px
          12px;

        background: #252525;

        color: #ffffff;

        border-radius: 7px;

        text-align: center;

        font-size: 1rem;

        font-weight: 900;
      }

      .hot-lap::before {
        content: "HOT LAP";

        display: block;

        margin-bottom: 5px;

        color: #aaaaaa;

        font-family: Arial, Helvetica, sans-serif;

        font-size: 0.58rem;

        font-weight: 800;

        letter-spacing: 1px;
      }


      /* PAGINATION */

      .pagination {
        padding:
          11px
          10px;

        gap: 8px;

        font-size: 0.7rem;
      }

      .pagination button {
        min-height: 34px;

        padding:
          6px
          9px;
      }

    }


    /* ========================================
       VERY SMALL MOBILE
    ======================================== */

    @media (max-width: 360px) {

      .container {
        width: 88%;

        max-width: 88%;
      }

      .header h1 {
        font-size: 1.05rem;
      }

      .header p {
        font-size: 0.55rem;

        letter-spacing: 0.6px;
      }

      .hot-lap {
        font-size: 0.92rem;
      }

    }

  </style>
</head>


<body>


  <div
    class="container"
    role="region"
    aria-label="META 2026 Hot Lap Results"
  >


    <!-- HEADER -->

    <div class="header">

      <h1>Practice META 2026</h1>

      <p>
        27 SEPTEMBER 2026
        &nbsp;•&nbsp;
        LIVE HOT LAP RESULTS
      </p>

    </div>


    <!-- SEARCH -->

    <div class="list-tools">

      <label class="search-control">

        Search drivers

        <input
          id="driver-search"
          type="search"
          placeholder="Driver or car"
          autocomplete="off"
        />

      </label>

    </div>


    <!-- LEADERBOARD -->

    <div class="leaderboard">


      <!-- DESKTOP HEADER -->

      <div
        class="leaderboard-header"
        aria-hidden="true"
      >

          <div>No.</div>

        <div>Driver</div>

        <div>Car</div>

        <div>Hot Lap</div>

      </div>


      <!-- DATA -->

      <div id="leaderboard-body">

        <div class="loading">
          🔄 Loading race data...
        </div>

      </div>


    </div>


    <!-- PAGINATION -->

    <nav
      class="pagination"
      aria-label="Driver results pages"
    >

      <button
        id="previous-page"
        type="button"
        disabled
      >
        Previous
      </button>

      <span
        id="page-status"
        aria-live="polite"
      >
        Page 1 of 1
      </span>

      <button
        id="next-page"
        type="button"
        disabled
      >
        Next
      </button>

    </nav>


  </div>


  <noscript>

    <p style="margin-top:16px">
      Please enable JavaScript to load leaderboard data.
    </p>

  </noscript>


  <script>

    /* ========================================
       SHEETBEST
    ======================================== */

    const SHEET_URL =
      "https://api.sheetbest.com/sheets/9121a906-0372-4545-bffa-4a22869f64d3";


    /* ========================================
       COLUMN ALIASES
    ======================================== */

    const KEY_ALIASES = {

      DRIVER: [
        "DRIVER",
        "Driver",
        "driver",
        "Nama",
        "Name"
      ],

      CAR: [
        "CAR",
        "Car",
        "car",
        "Mobil"
      ],

      HOTLAP: [
        "HOT LAP",
        "Hot Lap",
        "hot lap",
        "HOTLAP",
        "HotLap",
        "hotlap",
        "TIME",
        "Time",
        "time"
      ]

    };


    /* ========================================
       PICK VALUE
    ======================================== */

    function pick(obj, keys) {

      for (const key of keys) {

        const value = obj?.[key];

        if (
          value != null &&
          String(value).trim() !== ""
        ) {

          return String(value);

        }

      }

      return "";

    }


    /* ========================================
       NORMALIZE
    ======================================== */

    function normalize(rows) {

      return rows.map(row => ({

        DRIVER:
          pick(
            row,
            KEY_ALIASES.DRIVER
          ),

        CAR:
          pick(
            row,
            KEY_ALIASES.CAR
          ),

        HOTLAP:
          pick(
            row,
            KEY_ALIASES.HOTLAP
          )

      }));

    }


    /* ========================================
       STATE
    ======================================== */

    const PAGE_SIZE = 5;

    let allRows = [];

    let currentPage = 1;


    /* ========================================
       HTML ESCAPE
    ======================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* ========================================
       RENDER
    ======================================== */

    function render(
      rows,
      emptyMessage = "No race data available",
      startIndex = 0
    ) {

      const wrap =
        document.getElementById(
          "leaderboard-body"
        );


      if (!rows.length) {

        wrap.innerHTML = `
          <div class="error">
            ${escapeHTML(emptyMessage)}
          </div>
        `;

        return;

      }


      wrap.innerHTML =
        rows.map((row, index) => `

          <div class="driver-row">

            <div class="position">
              ${startIndex + index + 1}
            </div>

            <div class="driver-name">
              ${escapeHTML(row.DRIVER)}
            </div>


            <div class="car">
              ${escapeHTML(row.CAR)}
            </div>


            <div class="hot-lap">
              ${escapeHTML(row.HOTLAP) || "-"}
            </div>


          </div>

        `).join("");

    }


    /* ========================================
       UPDATE RESULTS
    ======================================== */

    function updateResults() {

      const query =
        document
          .getElementById("driver-search")
          .value
          .trim()
          .toLocaleLowerCase();


      const filteredRows =
        allRows.filter(row =>

          `${row.DRIVER} ${row.CAR}`
            .toLocaleLowerCase()
            .includes(query)

        );


      const pageCount =
        Math.max(
          1,
          Math.ceil(
            filteredRows.length /
            PAGE_SIZE
          )
        );


      currentPage =
        Math.min(
          currentPage,
          pageCount
        );


      const start =
        (currentPage - 1) *
        PAGE_SIZE;


      render(
        filteredRows.slice(
          start,
          start + PAGE_SIZE
        ),
        "No matching drivers",
        start
      );


      document
        .getElementById("page-status")
        .textContent =
          `Page ${currentPage} of ${pageCount}`;


      document
        .getElementById("previous-page")
        .disabled =
          currentPage === 1;


      document
        .getElementById("next-page")
        .disabled =
          currentPage >= pageCount;

    }


    /* ========================================
       LOAD SHEETBEST
    ======================================== */

    async function load() {

      const wrap =
        document.getElementById(
          "leaderboard-body"
        );


      try {

        const response =
          await fetch(
            SHEET_URL,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const raw =
          await response.json();


        const normalized =
          normalize(
            Array.isArray(raw)
              ? raw
              : []
          );


        /*
          Driver wajib ada.

          Hot Lap boleh kosong selama
          peserta belum mencatat waktu.
        */

        const valid =
          normalized.filter(row =>

            row.DRIVER.trim() !== ""

          );


        allRows = valid;


        /*
          Tidak reset ke page 1 setiap
          auto refresh supaya user tidak
          dilempar kembali ke awal.
        */

        updateResults();

      }

      catch (error) {

        console.error(
          "Failed to load SheetBest:",
          error
        );


        /*
          Kalau sebelumnya data sudah ada,
          pertahankan data tersebut.
        */

        if (allRows.length === 0) {

          wrap.innerHTML = `
            <div class="error">
              Failed to load data
            </div>
          `;

        }

      }

    }


    /* ========================================
       START
    ======================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {


        /* SEARCH */

        document
          .getElementById("driver-search")
          .addEventListener(
            "input",
            () => {

              currentPage = 1;

              updateResults();

            }
          );


        /* PREVIOUS */

        document
          .getElementById("previous-page")
          .addEventListener(
            "click",
            () => {

              if (currentPage > 1) {

                currentPage -= 1;

                updateResults();

              }

            }
          );


        /* NEXT */

        document
          .getElementById("next-page")
          .addEventListener(
            "click",
            () => {

              currentPage += 1;

              updateResults();

            }
          );


        /* INITIAL LOAD */

        load();


        /* AUTO REFRESH 30 DETIK */

        setInterval(
          load,
          30000
        );

      }
    );

  </script>


</body>

</html>
