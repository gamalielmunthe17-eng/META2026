<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Practice META 2026 - Best Time</title>

  <style>

    /* =====================================================
       BASE
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;

      background:
        url("assets/images/IMG_2811.PNG")
        no-repeat
        center top
        fixed;

      background-size: 100% auto;

      min-height: 100vh;

      padding: 20px;

      color: #fff;

      text-align: center;
    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .container {
      width: 90%;
      max-width: 900px;

      margin: 350px auto 0;

      border-radius: 14px;

      overflow: hidden;

      background: rgba(245, 245, 245, 0.96);

      border: 1px solid rgba(0, 0, 0, 0.12);

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.25);

      position: relative;
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .header {
      background: #171717;

      text-align: center;

      padding: 16px 15px 14px;

      border-left: 7px solid #d71920;
    }

    .header h1 {
      margin: 0 0 5px;

      color: #ffffff;

      font-size: 2rem;

      font-weight: 900;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .header p {
      margin: 0;

      color: #cfcfcf;

      font-size: 0.78rem;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }


    /* =====================================================
       LEADERBOARD
    ===================================================== */

    .leaderboard {
      width: 100%;

      overflow: hidden;
    }


    /* =====================================================
       GRID
       Rank | Driver | Car | Best Time
    ===================================================== */

    .leaderboard-header,
    .driver-row {
      display: grid;

      grid-template-columns:
        55px
        minmax(0, 1.5fr)
        minmax(0, 1fr)
        130px;

      align-items: center;

      gap: 12px;

      width: 100%;

      padding: 16px 22px;
    }


    /* =====================================================
       TABLE HEADER
    ===================================================== */

    .leaderboard-header {
      background: #d71920;

      color: #ffffff;

      font-size: 0.82rem;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 1px;

      border-bottom: 3px solid #ffd426;
    }


    /* =====================================================
       DRIVER ROW
    ===================================================== */

    .driver-row {
      background: rgba(255, 255, 255, 0.96);

      color: #181818;

      border-bottom: 1px solid #dddddd;

      transition: 0.2s ease;
    }

    .driver-row:nth-child(even) {
      background: #eeeeee;
    }

    .driver-row:hover {
      background: #e5e5e5;
    }


    /* =====================================================
       RANK
    ===================================================== */

    .rank {
      color: #333333;

      font-size: 1.05rem;

      font-weight: 900;

      text-align: center;
    }


    /* =====================================================
       TOP 1 - GOLD
    ===================================================== */

    .driver-row.rank-1 {
      border-left: 6px solid #ffd426;

      background:
        linear-gradient(
          90deg,
          rgba(255, 212, 38, 0.18),
          rgba(255, 255, 255, 0.96) 30%
        );
    }

    .driver-row.rank-1 .rank {
      color: #c59a00;

      font-size: 1.2rem;
    }


    /* =====================================================
       TOP 2 - SILVER
    ===================================================== */

    .driver-row.rank-2 {
      border-left: 6px solid #a8a8a8;

      background:
        linear-gradient(
          90deg,
          rgba(170, 170, 170, 0.16),
          rgba(255, 255, 255, 0.96) 30%
        );
    }

    .driver-row.rank-2 .rank {
      color: #777777;

      font-size: 1.15rem;
    }


    /* =====================================================
       TOP 3 - BRONZE
    ===================================================== */

    .driver-row.rank-3 {
      border-left: 6px solid #b87333;

      background:
        linear-gradient(
          90deg,
          rgba(184, 115, 51, 0.16),
          rgba(255, 255, 255, 0.96) 30%
        );
    }

    .driver-row.rank-3 .rank {
      color: #a45f27;

      font-size: 1.1rem;
    }


    /* =====================================================
       DRIVER
    ===================================================== */

    .driver-name {
      color: #181818;

      font-size: 1rem;

      font-weight: 900;

      text-transform: uppercase;

      text-align: left;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =====================================================
       CAR
    ===================================================== */

    .car {
      color: #555555;

      font-size: 0.95rem;

      font-weight: 700;

      text-align: center;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =====================================================
       BEST TIME - NORMAL
    ===================================================== */

    .time {
      color: #d71920;

      font-family: "Courier New", monospace;

      font-size: 1rem;

      font-weight: 900;

      text-align: center;

      white-space: nowrap;
    }


    /* =====================================================
       TOP 3 BEST TIME COLORS
    ===================================================== */

    /* Rank 1 - Gold */

    .driver-row.rank-1 .time {
      color: #c59a00;

      font-size: 1.08rem;
    }


    /* Rank 2 - Silver */

    .driver-row.rank-2 .time {
      color: #777777;

      font-size: 1.05rem;
    }


    /* Rank 3 - Bronze */

    .driver-row.rank-3 .time {
      color: #a45f27;

      font-size: 1.03rem;
    }


    /* =====================================================
       LOADING / ERROR
    ===================================================== */

    .loading,
    .error {
      background: rgba(255, 255, 255, 0.96);

      color: #555555;

      text-align: center;

      padding: 38px 20px;

      font-size: 1.05rem;

      font-weight: 700;
    }

    .error {
      color: #d71920;
    }


    /* =====================================================
       META STRIPE
    ===================================================== */

    .container::after {
      content: "";

      display: block;

      height: 9px;

      background:
        linear-gradient(
          to bottom,

          #171717 0%,
          #171717 33%,

          #d71920 33%,
          #d71920 66%,

          #ffd426 66%,
          #ffd426 100%
        );
    }


    /* =====================================================
       TABLET LANDSCAPE
       769px - 1024px
    ===================================================== */

    @media (min-width: 769px) and (max-width: 1024px) {

      .container {
        width: 88%;

        max-width: 820px;

        margin: 240px auto 0;
      }

      .leaderboard-header,
      .driver-row {
        grid-template-columns:
          45px
          minmax(0, 1.5fr)
          minmax(0, 1fr)
          110px;

        gap: 10px;

        padding: 15px 18px;
      }

      .header h1 {
        font-size: 1.8rem;
      }

    }


    /* =====================================================
       TABLET
       601px - 768px
    ===================================================== */

    @media (min-width: 601px) and (max-width: 768px) {

      .container {
        width: 92%;

        max-width: 92%;

        margin: 190px auto 0;
      }

      .leaderboard-header,
      .driver-row {
        grid-template-columns:
          40px
          minmax(0, 1.5fr)
          minmax(0, 1fr)
          100px;

        gap: 7px;

        padding: 14px 12px;
      }

      .header h1 {
        font-size: 1.65rem;

        white-space: nowrap;
      }

      .header p {
        font-size: 0.68rem;

        white-space: nowrap;
      }

      .leaderboard-header {
        font-size: 0.7rem;
      }

      .rank {
        font-size: 0.9rem;
      }

      .driver-name {
        font-size: 0.83rem;
      }

      .car {
        font-size: 0.78rem;
      }

      .time {
        font-size: 0.85rem;
      }

      .driver-row.rank-1 .time,
      .driver-row.rank-2 .time,
      .driver-row.rank-3 .time {
        font-size: 0.85rem;
      }

    }


    /* =====================================================
       MOBILE
       <= 600px
       TETAP HORIZONTAL
    ===================================================== */

    @media (max-width: 600px) {

      body {
        background-size: 100% 100%;

        background-position: center top;

        padding: 12px;
      }

      .container {
        width: 94%;

        max-width: 94%;

        margin: 120px auto 0;
      }


      /* HEADER */

      .header {
        padding: 15px 6px 13px;

        border-left-width: 5px;
      }

      .header h1 {
        font-size: 1.2rem;

        letter-spacing: 0.3px;

        white-space: nowrap;
      }

      .header p {
        font-size: 0.56rem;

        letter-spacing: 0.7px;

        white-space: nowrap;
      }


      /* GRID */

      .leaderboard-header,
      .driver-row {
        display: grid !important;

        grid-template-columns:
          28px
          minmax(0, 1.5fr)
          minmax(0, 0.95fr)
          72px !important;

        width: 100%;

        min-width: 0;

        gap: 3px;

        padding: 12px 5px;
      }


      /* TABLE HEADER */

      .leaderboard-header {
        font-size: 0.55rem;

        letter-spacing: 0.2px;
      }


      /* RANK */

      .rank {
        font-size: 0.72rem;
      }

      .driver-row.rank-1 .rank,
      .driver-row.rank-2 .rank,
      .driver-row.rank-3 .rank {
        font-size: 0.78rem;
      }


      /* DRIVER */

      .driver-name {
        font-size: 0.68rem;

        text-align: left;
      }


      /* CAR */

      .car {
        font-size: 0.62rem;

        text-align: center;
      }


      /* TIME */

      .time,
      .driver-row.rank-1 .time,
      .driver-row.rank-2 .time,
      .driver-row.rank-3 .time {
        font-size: 0.68rem;

        text-align: center;
      }


      /* TOP 3 BORDER */

      .driver-row.rank-1,
      .driver-row.rank-2,
      .driver-row.rank-3 {
        border-left-width: 4px;
      }


      /* EMPTY */

      .loading,
      .error {
        padding: 30px 10px;

        font-size: 0.85rem;
      }

    }


    /* =====================================================
       VERY SMALL MOBILE
       <= 400px
    ===================================================== */

    @media (max-width: 400px) {

      .container {
        width: 96%;

        max-width: 96%;
      }

      .leaderboard-header,
      .driver-row {
        grid-template-columns:
          25px
          minmax(0, 1.55fr)
          minmax(0, 0.9fr)
          67px !important;

        gap: 2px;

        padding-left: 4px;

        padding-right: 4px;
      }

      .leaderboard-header {
        font-size: 0.5rem;
      }

      .driver-name {
        font-size: 0.63rem;
      }

      .car {
        font-size: 0.58rem;
      }

      .time,
      .driver-row.rank-1 .time,
      .driver-row.rank-2 .time,
      .driver-row.rank-3 .time {
        font-size: 0.63rem;
      }

      .rank {
        font-size: 0.65rem;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================================
       LEADERBOARD CARD
  ===================================================== -->

  <div
    class="container"
    role="region"
    aria-label="META 2026 Leaderboard"
  >

    <!-- HEADER -->

    <div class="header">

      <h1>Practice META 2026</h1>

      <p>
        27 SEPTEMBER 2026
        &nbsp;•&nbsp;
        BEST TIME RESULTS
      </p>

    </div>


    <!-- LEADERBOARD -->

    <div class="leaderboard">


      <!-- TABLE HEADER -->

      <div
        class="leaderboard-header"
        aria-hidden="true"
      >

        <div>Position</div>

        <div>Driver</div>

        <div>Car</div>

        <div>Best Time</div>

      </div>


      <!-- DATA -->

      <div id="leaderboard-body">

        <div class="loading">
          🔄 Loading race data...
        </div>

      </div>

    </div>

  </div>


  <!-- =====================================================
       NO JAVASCRIPT
  ===================================================== -->

  <noscript>

    <p style="margin-top:16px">
      Please enable JavaScript to load leaderboard data.
    </p>

  </noscript>


  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script>

    /* =====================================================
       SHEETBEST
    ===================================================== */

    const SHEET_URL =
      "https://api.sheetbest.com/sheets/83dbd8a0-06c5-4b52-83d6-f262327228b6";


    /* =====================================================
       PARSE TIME

       Support:
       49.81
       00.49.81
       00:49.81
       1:10.500
    ===================================================== */

    function parseTime(t) {

      if (t == null) {
        return Infinity;
      }

      const s = String(t).trim();

      if (!s) {
        return Infinity;
      }


      /* Format m:ss.xxx */

      if (s.includes(":")) {

        const parts = s.split(":");

        if (parts.length === 2) {

          const minutes =
            parseFloat(parts[0]) || 0;

          const seconds =
            parseFloat(parts[1]) || 0;

          return (
            minutes * 60
          ) + seconds;

        }

      }


      /* Format 00.49.81 */

      const dotParts =
        s.split(".");


      if (dotParts.length === 3) {

        const minutes =
          parseFloat(dotParts[0]) || 0;

        const seconds =
          parseFloat(dotParts[1]) || 0;

        const fraction =
          parseFloat(
            "0." + dotParts[2]
          ) || 0;


        return (
          minutes * 60
        ) +
        seconds +
        fraction;

      }


      /* Format 49.81 */

      const number =
        parseFloat(s);


      return Number.isFinite(number)
        ? number
        : Infinity;

    }


    /* =====================================================
       HEADER ALIASES
    ===================================================== */

    const KEY_ALIASES = {

      DRIVER: [
        "DRIVER",
        "Driver",
        "driver",
        "Nama",
        "Name"
      ],

      CAR: [
        "CAR",
        "Car",
        "car",
        "Mobil"
      ],

      TIME: [
        "TIME",
        "Time",
        "time",
        "Best Time",
        "BEST TIME",
        "BestTime",
        "best_time"
      ]

    };


    /* =====================================================
       PICK VALUE
    ===================================================== */

    function pick(obj, keys) {

      for (const k of keys) {

        const v = obj?.[k];

        if (
          v != null &&
          String(v).trim() !== ""
        ) {

          return String(v).trim();

        }

      }

      return "";

    }


    /* =====================================================
       NORMALIZE
    ===================================================== */

    function normalize(rows) {

      return rows.map(r => ({

        DRIVER:
          pick(
            r,
            KEY_ALIASES.DRIVER
          ),

        CAR:
          pick(
            r,
            KEY_ALIASES.CAR
          ),

        TIME:
          pick(
            r,
            KEY_ALIASES.TIME
          )

      }));

    }


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHTML(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function render(rows) {

      const wrap =
        document.getElementById(
          "leaderboard-body"
        );


      /* Tidak ada data */

      if (!rows.length) {

        wrap.innerHTML = `
          <div class="error">
            No race data available
          </div>
        `;

        return;

      }


      /* ===================================================
         SORT
         Waktu tercepat otomatis di atas
      =================================================== */

      rows.sort(
        (a, b) =>
          parseTime(a.TIME) -
          parseTime(b.TIME)
      );


      /* ===================================================
         GENERATE ROW
      =================================================== */

      wrap.innerHTML =
        rows.map(
          (r, index) => {

            const rank =
              index + 1;


            let rankClass = "";


            if (rank === 1) {
              rankClass = "rank-1";
            }

            else if (rank === 2) {
              rankClass = "rank-2";
            }

            else if (rank === 3) {
              rankClass = "rank-3";
            }


            return `

              <div
                class="driver-row ${rankClass}"
              >

                <div class="rank">
                  ${rank}
                </div>

                <div class="driver-name">
                  ${escapeHTML(r.DRIVER)}
                </div>

                <div class="car">
                  ${escapeHTML(r.CAR)}
                </div>

                <div class="time">
                  ${escapeHTML(r.TIME)}
                </div>

              </div>

            `;

          }

        ).join("");

    }


    /* =====================================================
       LOAD DATA
    ===================================================== */

    async function load() {

      const wrap =
        document.getElementById(
          "leaderboard-body"
        );


      try {

        const res =
          await fetch(
            SHEET_URL,
            {
              cache: "no-store"
            }
          );


        if (!res.ok) {

          throw new Error(
            `HTTP ${res.status}`
          );

        }


        const data =
          await res.json();


        const norm =
          normalize(
            Array.isArray(data)
              ? data
              : []
          );


        /* Hanya row yang punya DRIVER */

        const valid =
          norm.filter(
            r =>
              String(
                r.DRIVER ?? ""
              ).trim() !== ""
          );


        render(valid);

      }

      catch (err) {

        console.error(
          "Gagal mengambil data:",
          err
        );


        wrap.innerHTML = `
          <div class="error">
            Failed to load data
          </div>
        `;

      }

    }


    /* =====================================================
       START
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        /* Load pertama */

        load();


        /* =================================================
           AUTO REFRESH
           30000 ms = 30 detik
        ================================================= */

        setInterval(
          load,
          30000
        );

      }
    );

  </script>

</body>

</html>
